<!DOCTYPE html>
<html lang="en-US" dir="ltr" class="Mrphs-html"
	xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<!-- Style -->
<link href="resources/app-assets/css/mystyle.css" rel="stylesheet"
	type="text/css" media="all">
<link rel="stylesheet" type="text/css"
	href="resources/app-assets/vendors/css/tables/datatable/datatables.min.css">
<link rel="stylesheet" type="text/css"
	href="resources/app-assets/vendors/css/tables/extensions/autoFill.dataTables.min.css">
<link rel="stylesheet" type="text/css"
	href="resources/app-assets/vendors/css/tables/extensions/colReorder.dataTables.min.css">
<link rel="stylesheet" type="text/css"
	href="resources/app-assets/vendors/css/tables/datatable/dataTables.bootstrap4.min.css">
<link rel="stylesheet" type="text/css"
	href="resources/app-assets/vendors/css/tables/datatable/jquery.dataTables.min.css">
<link rel="stylesheet" type="text/css"
	href="resources/app-assets/vendors/css/tables/datatable/select.dataTables.min.css">
<link rel="stylesheet" type="text/css"
	href="resources/app-assets/vendors/css/tables/datatable/buttons.bootstrap4.min.css">
<link rel="stylesheet" type="text/css"
	href="resources/app-assets/vendors/css/extensions/offline/themes/offline-theme-slide.css">
<link rel="stylesheet" type="text/css"
	href="resources/app-assets/vendors/css/extensions/offline/themes/offline-language-english.css">

<title>xTOEIC</title>
<style>
#audioTextDialog {
	cursor: move; /* Hiển thị biểu tượng di chuyển */
}
</style>

<script type="text/javascript"
	src="resources/app-assets/js/exam-part-1-vovantri.js"></script>
<script type="text/javascript"
	src="resources/app-assets/js/exam-part-1-LyHung.js"></script>
</head>

<body>
	<div class="Mrphs-pagebody">

		<nav class="Mrphs-siteHierarchy">
			<div class="Mrphs-hierarchy--sites">
				<span class="Mrphs-hierarchy--siteName" title="English"> <a
					href="http://xlms.myworkspace.vn/portal/site/331180a0-0361-48d4-bc82-d120869731f9/page-reset/e61c380b-e068-4ed9-b966-cc9fbf92c447">
						<span class="Mrphs-hierarchy--siteName-label"> English </span>
				</a>
				</span> <span
					class="Mrphs-hierarchy--siteNameSeparator Mrphs-hierarchy--separator">
					<i class="fa fa-lg fa-angle-right" aria-hidden="true"></i>
				</span>
			</div>

			<a
				href="http://xlms.myworkspace.vn/portal/site/331180a0-0361-48d4-bc82-d120869731f9/tool-reset/ec30a288-c102-4d00-8f67-798e4d29f47d"
				title="Tool Home"
				class="Mrphs-hierarchy-item Mrphs-hierarchy--toolName"> <span
				class="Mrphs-breadcrumb--reset-icon fa fa-share" aria-hidden="true"></span>
				<span class="Mrphs-breadcrumb--icon icon-sakai--sakai-toeic "></span>
				<span class="Mrphs-breadcrumb--toolNameText">TOEIC</span>
			</a>
		</nav>

		<div class="row">
			<div class="col-md-4">
				<div data-toolbar="set-04"
					class="btn-toolbar btn-toolbar-primary mx-auto"
					data-toolbar-style="primary"></div>
			</div>
			<div class="col-md-4 text-center">
				<h2 id="assessmentTitle" th:text="${exam.title}">ETS ... #...</h2>
			</div>
			<div class="col-md-4">
				<div class="toeic-clock text-center">
					<div id="time-remain-area" class="collapse in">
						Time remaining: <span id="time_remain">120:00</span>
					</div>
				</div>
			</div>
		</div>

		<div id="test_page" class="toeic-contain">
			<div class="row">
				<!-- question area -->
				<div class="question-area col-sm-7">
					<div class="area-part" id="question_contain">
						<div class="title-part">
							<h3 id="title_part">Part 2: Question and Response</h3>
							<button class="btn btn-info" style="margin: 5px"
								onclick="showAudioTextDialog()">Show Audio Text</button>
						</div>

						<!-- Hộp thoại sẽ hiển thị text của âm thanh -->
						<div id="audioTextDialog"
							style="display: none; padding: 20px; border: 1px solid #ccc; background: #f9f9f9; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 9999;">
							<h3>Audio Text</h3>
							<p id="audioTextContent"></p>
							<button onclick="closeAudioTextDialog()">Close</button>
						</div>

						<!-- Câu hỏi theo phân trang -->
						<div id="questionPage" class="question-page">
							<div th:each="questionDetail, iterStat : ${questionDetailsList}"
								th:classappend="${iterStat.index < 4 ? 'active' : ''}"
								class="test-box" style="display: none;"
								th:id="'question-' + ${iterStat.index}">
								<div class="toeic-index">
									<h4 id="question_number">
										Question <span th:text="${iterStat.index + 1}"></span>
									</h4>
								</div>

								<div class="for-listening text-center audio_question">
									<div class="black"></div>
									<audio class="mt-md-3s" preload="auto"
										th:src="${questionDetail.audioUrl}"
										th:id="'audio-' + ${iterStat.index}" controls
										th:onended="onAudioEnded(${iterStat.index})">
									</audio>
								</div>
								<p>
									Link Audio gốc: <a th:href="${questionDetail.audioUrl}"
										th:text="${questionDetail.audioUrl}"></a>
								</p>

								<div class="toeic-select">
									<form class="toeic-form" action="#" method="POST"
										th:name="'form-' + ${iterStat.index + 1}"
										th:id="'form-' + ${iterStat.index + 1}">
										<button type="button" class="btn btn-success"
											style="margin-top: 10px;"
											th:onclick="'submitForm(' + ${iterStat.index + 1} + ')'">Save</button>
										<div>
											<input type="hidden" name="answerId"
												th:id="'answerId-' + ${iterStat.index + 1}" readonly
												style="margin-left: 10px;">
										</div>
										<div>
											<input type="hidden" name="answerText"
												th:id="'answerText-' + ${iterStat.index + 1}" readonly
												style="margin-left: 10px;">
										</div>
									</form>
								</div>
							</div>
						</div>
					</div>
				</div>

				<!-- answer area -->
				<div class="col-sm-5">
					<div class="title-part">
						<h3 class="text-center">
							<button class="btn btn-info" style="margin: 5px;"
								onclick="toastr.remove();">
								<i class="fa fa-bell-slash"></i>
							</button>
							Answer sheet
						</h3>
					</div>

					<div id="answer_sheet" class="answer-area">
						<div th:each="questionDetail, iterStat : ${questionDetailsList}">
							<div class="toeic-form answer-form"
								th:id="'answer_form_' + (${iterStat.index + 7})"
								style="margin-left: 9px; display: flex; align-items: center;">
								<label class="ques-no" th:text="${iterStat.index + 7} + '. '"
									style="margin-right: 25px"></label>
								<div th:each="answer, iStat : ${questionDetail.answers}">
									<label class="radio-inline"
										th:if="${#strings.trim(answer.text) != ''}"
										style="display: inline-block; margin-right: 42px;"> <input
										type="radio" tabindex="-1"
										th:attr="attrid=${questionDetail.item.itemId}, poolname='Part1', answerid=${answer.answerId}, num=${iterStat.index + 7}, name=${'optradio[' + questionDetail.item.itemId + ']'}"
										th:value="${'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.substring(iStat.index, iStat.index + 1)}"
										th:onclick="'selectAnswer(' + ${answer.answerId} + ')'">
										<strong
										th:text="${'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.substring(iStat.index, iStat.index + 1)}">A</strong>
									</label>
								</div>
							</div>
						</div>
					</div>

					<div class="toeic-btn text-center">
						<button type="button" class="btn btn-primary" id="nextBtn"
							onclick="nextQuestion()">Next</button>
					</div>
				</div>
			</div>
		</div>

		<!-- Scripts -->
		<script>
            let currentGroup = 0; // Chỉ số nhóm câu hỏi hiện tại
            const totalGroups = Math.ceil(${questionDetailsList.size()} / 4); // Tổng số nhóm câu hỏi

            function showQuestions() {
                const questions = document.querySelectorAll('.test-box');
                questions.forEach((group, index) => {
                    group.style.display = (Math.floor(index / 4) === currentGroup) ? 'block' : 'none'; // Hiển thị nhóm câu hỏi hiện tại
                });
            }

            function nextQuestion() {
                if (currentGroup < totalGroups - 1) {
                    currentGroup++;
                    showQuestions();
                }
            }

            document.addEventListener("DOMContentLoaded", () => {
                showQuestions(); // Hiển thị nhóm câu hỏi đầu tiên khi tải trang
            });

            function showAudioTextDialog() {
                // Mã mở hộp thoại hiển thị văn bản âm thanh
                document.getElementById("audioTextDialog").style.display = "block";
                document.getElementById("audioTextContent").innerText = "Audio text goes here...";
            }

            function closeAudioTextDialog() {
                // Mã đóng hộp thoại hiển thị văn bản âm thanh
                document.getElementById("audioTextDialog").style.display = "none";
            }
        </script>
	</div>
</body>
</html>
