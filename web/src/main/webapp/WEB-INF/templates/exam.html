<script>
    const dlgAssessmentGrading = $("#dlgAssessmentGrading");

    function openResult(examId) {
        $.post("/exam/"+examId + "/result").done(function (fragment) {
            $("#exam_result").replaceWith(fragment);
        });
        dlgAssessmentGrading.css('display', 'block');
        dlgAssessmentGrading.addClass("in");
    }

    function closeResult() {
        dlgAssessmentGrading.removeClass("in");
        dlgAssessmentGrading.css('display', 'none');
    }
</script>
