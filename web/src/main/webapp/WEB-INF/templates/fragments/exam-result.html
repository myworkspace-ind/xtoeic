<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="exam_result" class="modal-dialog modal-lg" role="document" id="exam_result">
    <div class="modal-content">
        <div class="modal-header">
            <button type="button" class="close"
                    style="color: black !important; opacity: 1 !important;"
                    th:onclick="closeResult()"
                    data-dismiss="modal">×
            </button>
            <h4 class="modal-title" id="myModalLabel">Result</h4>
        </div>
        <div class="modal-body">
            <div id="resultTable_wrapper"
                 class="dataTables_wrapper container-fluid dt-bootstrap4 no-footer">
                <div class="row">
                    <div class="col-sm-12 col-md-6">
                        <div class="dataTables_length" id="resultTable_length"><label>Show
                            <select name="resultTable_length" aria-controls="resultTable"
                                    class="form-control form-control-sm">
                                <option value="20">20</option>
                                <!--                                                        <option value="10">10</option>-->
                                <!--                                                        <option value="25">25</option>-->
                                <!--                                                        <option value="50">50</option>-->
                                <!--                                                        <option value="100">100</option>-->
                            </select> entries</label></div>
                        <button class="btn btn-info" style="margin-left: 30px; margin-top: 0px;"
                                id="exportSR" onclick="exportStudentAssessmentResult()"
                                disabled="">Export
                        </button>
                    </div>
                    <div class="col-sm-12 col-md-6">
                        <div id="resultTable_filter" class="dataTables_filter">
                            <label>Search:<input type="search"
                                                 class="form-control form-control-sm"
                                                 placeholder=""
                                                 aria-controls="resultTable"></label></div>
                    </div>
                </div>
                <div class="row" style="overflow-y: auto; max-height: 480px">
                    <div class="col-sm-12">
                        <table id="resultTable"
                               class="table table-striped table-bordered dataTable no-footer"
                               role="grid" aria-describedby="resultTable_info"
                               style="width: 100%">
                            <thead>
                            <tr role="row">
                                <th class="sorting_asc" tabindex="0" aria-controls="resultTable"
                                    rowspan="1" colspan="1" style="width: 0px;"
                                    aria-label="Attempt Date: activate to sort column descending"
                                    aria-sort="ascending">Attempt Date
                                </th>
                                <th class="sorting" tabindex="0" aria-controls="resultTable"
                                    rowspan="1" colspan="1" style="width: 0px;"
                                    aria-label="Submitted Date: activate to sort column ascending">
                                    Submitted Date
                                </th>
                                <th class="sorting" tabindex="0" aria-controls="resultTable"
                                    rowspan="1" colspan="1" style="width: 0px;"
                                    aria-label="Final Score: activate to sort column ascending">
                                    Final Score
                                </th>
                                <th class="sorting" tabindex="0" aria-controls="resultTable"
                                    rowspan="1" colspan="1" style="width: 0px;"
                                    aria-label="Details: activate to sort column ascending">
                                    Details
                                </th>
                            </tr>
                            </thead>
                            <tbody>
                            <div th:if="${examResultPage == null || examResultPage.totalElements == 0}">
                                <tr class="odd">
                                    <td colspan="4" class="dataTables_empty">No data
                                        available in table
                                    </td>
                                </tr>
                            </div>
                            <tr th:each="examResult : ${examResultPage.content}">
                                <td th:text="${examResult.attemptDate}"></td>
                                <td th:text="${examResult.submittedDate}"></td>
                                <td th:text="${examResult.finalScore}"></td>
                                <td><a th:href="@{/exam/{id}/result/{gradingId}(id = ${examResult.assessmentId}, gradingId = ${examResult.id})}">Show</a></td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
                <div class="row">
                    <div class="col-sm-12 col-md-5">
                        <div class="dataTables_info" id="resultTable_info" role="status"
                             aria-live="polite">
                            Showing <span
                                th:text="|${examResultPage.pageable.pageNumber + 1} to |"/>
                            <span th:text="${((examResultPage.pageable.pageNumber+1)*examResultPage.pageable.pageSize) > examResultPage.totalElements ? examResultPage.totalElements : (examResultPage.pageable.pageNumber+1)*examResultPage.pageable.pageSize}"/>
                            <span th:text="| of ${examResultPage.totalElements} entries|"/>
                        </div>
                    </div>
                    <div class="col-sm-12 col-md-7">
                        <div class="dataTables_paginate paging_simple_numbers"
                             id="resultTable_paginate">
                            <ul class="pagination">
                                <li class="paginate_button page-item previous disabled"
                                    id="resultTable_previous"><a href="#"
                                                                 aria-controls="resultTable"
                                                                 data-dt-idx="0" tabindex="0"
                                                                 class="page-link">Previous</a>
                                </li>
                                <li class="paginate_button page-item next disabled"
                                    id="resultTable_next"><a href="#"
                                                             aria-controls="resultTable"
                                                             data-dt-idx="1" tabindex="0"
                                                             class="page-link">Next</a></li>
                            </ul>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
